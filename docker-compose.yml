services:
  user-auth-service:
    build: .
    container_name: user-auth-service
    restart: always

    env_file:
      - .env

    ports:
      - "8007:8007"

    volumes:
      # Shared chat uploads directory
      - /var/www/chat-uploads:/shared/chat-uploads

    networks:
      - dhwaniastro-net

    mem_limit: 512m
    memswap_limit: 512m

networks:
  dhwaniastro-net:
    external: true